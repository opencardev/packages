---
name: APT Auto-Publish Monitor

permissions:
  contents: write
  actions: write

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      force_check:
        description: 'Force check for all repos'
        required: false
        type: boolean
        default: true

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    strategy:
      max-parallel: 1
      matrix:
        repo:
          - owner: opencardev
            name: aasdk
            main_branch: main
            dev_branch: develop
            build_workflow: CI
          - owner: opencardev
            name: openauto
            main_branch: main
            dev_branch: develop
            build_workflow: "OpenAuto Build and Test"
          - owner: opencardev
            name: crankshaft.core
            main_branch: main
            dev_branch: develop
            build_workflow: CI

    steps:
      - name: Check for new successful builds
        id: check_builds
        run: |
          set -euo pipefail
          
          OWNER="${{ matrix.repo.owner }}"
          REPO="${{ matrix.repo.name }}"
          MAIN_BRANCH="${{ matrix.repo.main_branch }}"
          DEV_BRANCH="${{ matrix.repo.dev_branch }}"
          BUILD_WORKFLOW="${{matrix.repo.build_workflow }}"
          
          echo "🔍 Checking $OWNER/$REPO for new builds"
          
          # Get the last published build ID from our state file (if exists)
          # For now, just check the last successful run on each branch
          
          # Check main branch for stable
          echo "Checking $MAIN_BRANCH branch (stable channel)..."
          MAIN_RUN=$(gh run list --repo "$OWNER/$REPO" \
            --branch "$MAIN_BRANCH" \
            --workflow "$BUILD_WORKFLOW" \
            --status completed \
            --json databaseId,conclusion,headBranch \
            --limit 1 | jq -r '.[0] | select(.conclusion == "success") | .databaseId')
          
          if [ -n "$MAIN_RUN" ] && [ "$MAIN_RUN" != "null" ]; then
            echo "✅ Found stable build: $MAIN_RUN"
            echo "main_run=$MAIN_RUN" >> $GITHUB_OUTPUT
            echo "has_main=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  No successful main branch build found"
            echo "has_main=false" >> $GITHUB_OUTPUT
          fi
          
          # Check dev branch for nightly
          if [ "$DEV_BRANCH" != "$MAIN_BRANCH" ]; then
            echo "Checking $DEV_BRANCH branch (nightly channel)..."
            DEV_RUN=$(gh run list --repo "$OWNER/$REPO" \
              --branch "$DEV_BRANCH" \
              --workflow "$BUILD_WORKFLOW" \
              --status completed \
              --json databaseId,conclusion,headBranch \
              --limit 1 | jq -r '.[0] | select(.conclusion == "success") | .databaseId')
          
            if [ -n "$DEV_RUN" ] && [ "$DEV_RUN" != "null" ]; then
              echo "✅ Found nightly build: $DEV_RUN"
              echo "dev_run=$DEV_RUN" >> $GITHUB_OUTPUT
              echo "has_dev=true" >> $GITHUB_OUTPUT
            else
              echo "ℹ️  No successful dev branch build found"
              echo "has_dev=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "ℹ️  Dev branch same as main, skipping nightly check"
            echo "has_dev=false" >> $GITHUB_OUTPUT
          fi
          
          # Store repo info
          echo "repo_full=$OWNER/$REPO" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger publish for stable (main branch)
        if: steps.check_builds.outputs.has_main == 'true'
        run: |
          echo "🚀 Triggering publish for stable channel"
          
          gh workflow run apt-publish.yml \
            --repo opencardev/packages \
            -f source_repo="${{ steps.check_builds.outputs.repo_full }}" \
            -f build_run_id="${{ steps.check_builds.outputs.main_run }}" \
            -f channel="stable"
          
          echo "✅ Triggered stable publish for build ${{ steps.check_builds.outputs.main_run }}"
          echo "⏳ Waiting for the stable publish to complete before continuing"
          publish_run_id=$(gh run list --repo opencardev/packages \
            --workflow "apt-publish.yml" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -n "$publish_run_id" ] && [ "$publish_run_id" != "null" ]; then
            gh run watch "$publish_run_id" --repo opencardev/packages
          else
            echo "❌ Could not determine publish run id for stable channel"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger publish for nightly (dev branch)
        if: steps.check_builds.outputs.has_dev == 'true'
        run: |
          echo "🚀 Triggering publish for nightly channel"
          
          gh workflow run apt-publish.yml \
            --repo opencardev/packages \
            -f source_repo="${{ steps.check_builds.outputs.repo_full }}" \
            -f build_run_id="${{ steps.check_builds.outputs.dev_run }}" \
            -f channel="nightly"
          
          echo "✅ Triggered nightly publish for build ${{ steps.check_builds.outputs.dev_run }}"
          echo "⏳ Waiting for the nightly publish to complete before continuing"
          publish_run_id=$(gh run list --repo opencardev/packages \
            --workflow "apt-publish.yml" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -n "$publish_run_id" ] && [ "$publish_run_id" != "null" ]; then
            gh run watch "$publish_run_id" --repo opencardev/packages
          else
            echo "❌ Could not determine publish run id for nightly channel"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: monitor
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Summary
        run: |
          echo "# APT Auto-Publish Monitor Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.monitor.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Monitored Repositories" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | Main Branch | Dev Branch |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "| opencardev/aasdk | main → stable | develop → nightly |" >> $GITHUB_STEP_SUMMARY
          echo "| opencardev/openauto | main → stable | develop → nightly |" >> $GITHUB_STEP_SUMMARY
          echo "| opencardev/crankshaft.core | main → stable | develop → nightly |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.monitor.result }}" == "success" ]; then
            echo "✅ All repositories checked successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "*Note: Check individual job logs to see which builds were detected and triggered for publishing.*" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some repository checks may have failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the job logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Next scheduled run: Every 6 hours*" >> $GITHUB_STEP_SUMMARY
