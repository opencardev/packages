name: opencardev APT Repository Upload (Aptly)

permissions:
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repository (e.g., opencardev/aasdk)'
        required: false
        default: 'opencardev/aasdk'
        type: string
      build_run_id:
        description: 'Build run ID to publish to APT repo'
        required: true
        type: string
      # left for backward support
      apt_import:
        description: 'Whether to import packages into the APT repo (true/false)'
        required: false
        default: 'false'
        type: string
      apt_category:
        description: 'APT category/component (e.g., main, contrib)'
        required: false
        default: 'main'
        type: string
      distribution:
        description: 'Distribution to publish to'
        required: false
        default: 'trixie'
        type: choice
        options:
          - trixie
          - bookworm
          - all
  
  repository_dispatch:
    types: [publish-apt-packages]
  
  workflow_call:
    inputs:
      source_repo:
        description: 'Source repository (e.g., opencardev/aasdk)'
        required: false
        default: 'opencardev/aasdk'
        type: string
      build_run_id:
        description: 'Build run ID to publish to APT repo'
        required: true
        type: string

jobs:
  create-apt-repo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        prefix:
          - name: debian
            repos: ""
    steps:
    - name: Checkout packages repository
      uses: actions/checkout@v4

    - name: Download artifacts from build run
      run: |
        # Handle inputs from different trigger types
        SOURCE_REPO="${{ inputs.source_repo || github.event.client_payload.source_repo || 'opencardev/aasdk' }}"
        BUILD_RUN_ID="${{ inputs.build_run_id || github.event.client_payload.build_run_id }}"
        DISTRIBUTION="${{ inputs.distribution || github.event.client_payload.distribution || 'trixie' }}"
        APT_CATEGORY="${{ inputs.apt_category || github.event.client_payload.apt_category || 'main' }}"
        APT_IMPORT="${{ inputs.apt_import || github.event.client_payload.apt_import || './debs/*/*.deb' }}"
        APT_GLOB="${{ inputs.apt_glob || github.event.client_payload.apt_glob || '' }}"
            
        echo "Downloading artifacts from run ID: $BUILD_RUN_ID in repository: $SOURCE_REPO"
        echo "Distribution: $DISTRIBUTION"
        
        # Download all artifacts from the specified run
        gh run download $BUILD_RUN_ID --repo $SOURCE_REPO --dir ./downloaded-artifacts
        
        echo "Downloaded artifacts structure:"
        find ./downloaded-artifacts -type f -name "*.deb" | head -20
        
        # Verify we have packages
        DEB_COUNT=$(find ./downloaded-artifacts -name "*.deb" 2>/dev/null | wc -l)
        if [ "$DEB_COUNT" -eq 0 ]; then
          echo "Error: No .deb packages found in build run $BUILD_RUN_ID"
          exit 1
        fi
        echo "✓ Found $DEB_COUNT .deb packages to process"
        
        # Create a consolidated debs directory with organized structure
        mkdir -p ./debs
        
        # Copy and organize .deb files by suite and architecture (supports multiple projects: aasdk, openauto, crankshaft-mvp)
        # Use process substitution to avoid subshell issues with variable persistence
        while IFS= read -r deb_file; do
          filename=$(basename "$deb_file")
          suite="unknown"
          arch_dir="unknown"
          parent_dir=$(basename "$(dirname "$deb_file")")
          
          # PRIORITY 1: Extract from path first (most reliable for packages with consistent artifact folder naming)
          # Path patterns: <project>-packages-<suite>-<arch>, <suite>-<arch>, <project>-<suite>-<arch>
          if [[ "$parent_dir" =~ ([a-z0-9]+)-packages-([a-z0-9]+)-(amd64|arm64|armhf|i386|arm) ]]; then
            suite="${BASH_REMATCH[2]}"
            arch_dir="${BASH_REMATCH[3]}"
            echo "✓ Suite/arch from project path: $suite, $arch_dir"
          elif [[ "$parent_dir" =~ ^(deb1[0-3]|deb13u[0-9]|bookworm|bullseye|trixie|jammy|noble|focal|ubuntu[0-9]+\.[0-9]+)-(amd64|arm64|armhf|i386|arm)$ ]]; then
            suite="${BASH_REMATCH[1]}"
            arch_dir="${BASH_REMATCH[2]}"
            echo "✓ Suite/arch from generic path: $suite, $arch_dir"
          fi
          
          # PRIORITY 2: Extract from filename if path didn't yield results
          # Filename patterns: package_version_suite_arch.deb, package_version-arch.deb
          if [[ "$suite" == "unknown" ]]; then
            # Multi-suite pattern: deb13u1_amd64, bookworm_arm64, trixie_armhf, etc.
            if [[ "$filename" =~ _([a-z0-9]+)_(amd64|arm64|armhf|i386|arm)\.deb$ ]]; then
              suite_candidate="${BASH_REMATCH[1]}"
              # Validate suite candidate (looks like deb*, bookworm, etc.)
              if [[ "$suite_candidate" =~ ^(deb1[0-3]|deb13u[0-9]|bookworm|bullseye|trixie|jammy|noble|focal)$ ]]; then
                suite="$suite_candidate"
                echo "✓ Suite from filename: $suite"
              fi
            fi
          fi
          
          # Extract architecture from filename if not already found
          if [[ "$arch_dir" == "unknown" ]]; then
            if [[ "$filename" =~ _(amd64|arm64|armhf|i386|arm)\.deb$ ]] || [[ "$filename" =~ (amd64|arm64|armhf|i386|arm) ]]; then
              for arch in amd64 arm64 armhf i386 arm; do
                if [[ "$filename" == *"$arch"* ]]; then
                  arch_dir="$arch"
                  echo "✓ Arch from filename: $arch_dir"
                  break
                fi
              done
            fi
          fi
          
          # FALLBACK: If suite still unknown, use generic "stable" + infer from parent folder if possible
          if [[ "$suite" == "unknown" ]]; then
            # Last resort: check if parent contains known suite names
            if [[ "$parent_dir" =~ (deb1[0-9]|bookworm|bullseye|trixie|jammy|noble|focal) ]]; then
              suite="${BASH_REMATCH[1]}"
              echo "✓ Suite from fallback: $suite"
            else
              # Default to trixie if absolutely no pattern match
              suite="trixie"
              echo "⚠ Suite defaulting to: $suite"
            fi
          fi
          
          # Normalize arm to armhf for consistency
          if [[ "$arch_dir" == "arm" ]]; then
            arch_dir="armhf"
          fi
          
          # Only skip if arch is still unknown (we can tolerate unknown suite)
          if [[ "$arch_dir" != "unknown" ]]; then
            echo "→ Organizing $filename into debs/$suite/$arch_dir/ and debs/nightly-$suite/$arch_dir/"
            mkdir -p "./debs/$suite/$arch_dir"
            mkdir -p "./debs/nightly-$suite/$arch_dir"
            cp "$deb_file" "./debs/$suite/$arch_dir/" 2>/dev/null && echo "  ✓ Copied to stable"
            cp "$deb_file" "./debs/nightly-$suite/$arch_dir/" 2>/dev/null && echo "  ✓ Copied to nightly"
          else
            echo "⚠ Skipping $filename (unable to determine architecture)"
          fi
        done < <(find ./downloaded-artifacts -name "*.deb" -type f)
        
        echo ""
        echo "=== Final debs structure ==="
        find ./debs -type f -name "*.deb" | sort
        FINAL_COUNT=$(find ./debs -name "*.deb" 2>/dev/null | wc -l)
        echo "✓ Organised $FINAL_COUNT .deb packages into repository structure"

        echo "Final debs structure:"
        find ./debs -type f -name "*.deb"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Aptly Repos Configuration
      id: generate-repos
      run: |
        # Generate repos configuration dynamically based on discovered suites
        REPOS=""
        
        # Find all unique suites in the debs directory
        SUITES=$(find ./debs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | uniq)
        
        if [ -z "$SUITES" ]; then
          echo "❌ Error: No suites found in debs directory"
          exit 1
        fi
        
        echo "Discovered suites: $SUITES"
        
        # For each suite, generate stable and nightly repo entries
        for suite in $SUITES; do
          if [[ "$suite" == nightly-* ]]; then
            continue  # Skip nightly entries as we'll handle them separately
          fi
          
          # Find all architectures for this suite
          ARCHS=$(find "./debs/$suite" -mindepth 1 -maxdepth 1 -type d -printf '%f,' | sed 's/,$//')
          
          if [ -z "$ARCHS" ]; then
            echo "⚠ No architectures found for suite: $suite"
            continue
          fi
          
          echo "Suite '$suite' has architectures: $ARCHS"
          
          # Create repo entries for stable and nightly (keep quoted arch list for Aptly)
          STABLE_REPOS="${STABLE_REPOS}${suite},stable,\"${ARCHS}\",false,debs/${suite}/**/*.deb"$'\n'
          NIGHTLY_REPOS="${NIGHTLY_REPOS}nightly-${suite},nightly,\"${ARCHS}\",false,debs/nightly-${suite}/**/*.deb"$'\n'
        done
        
        # Combine repos configuration
        REPOS="${STABLE_REPOS}${NIGHTLY_REPOS}"
        
        # Remove trailing newline
        REPOS=$(printf '%s\n' "$REPOS" | sed '/^$/d')
        
        echo "Generated repos configuration:"
        printf '%s\n' "$REPOS"
        
        # Output as multiline string for use in matrix - preserve quoting for Aptly
        {
          printf 'repos<<EOF\n'
          printf '%s\n' "$REPOS"
          printf 'EOF\n'
        } >> $GITHUB_OUTPUT

    - name: Debug GPG Configuration
      run: |
        echo "Checking GPG configuration..."
        if [ -n "${{ secrets.APT_SIGNING_KEY }}" ]; then
          echo "✅ APT_SIGNING_KEY secret is present (length: $(echo '${{ secrets.APT_SIGNING_KEY }}' | wc -c))"
        else
          echo "❌ APT_SIGNING_KEY secret is missing or empty"
        fi
        
        if [ -n "${{ secrets.APT_SIGNING_PASSPHRASE }}" ]; then
          echo "✅ APT_SIGNING_PASSPHRASE secret is present"
        else
          echo "⚠️  APT_SIGNING_PASSPHRASE secret is missing (may not be required)"
        fi

    - name: Create APT Repository
      uses: jinnatar/actions-aptly-repo@v2
      with:
        name: opencardev-apt
        repo_url: https://opencardev.github.io/packages
        prefix: "${{ matrix.prefix.name }}"
        repos: "${{ steps.generate-repos.outputs.repos }}"
        gpg_private_key: ${{ secrets.APT_SIGNING_KEY }}
        gpg_passphrase: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        artifact_name: opencardev-apt-repo

  deploy-apt-repo:
    needs: create-apt-repo
    runs-on: ubuntu-latest
    if: always() && needs.create-apt-repo.result == 'success'
    
    steps:
    - name: Checkout packages repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main

    - name: Download APT repository artifacts
      uses: actions/download-artifact@v5
      with:
        pattern: opencardev-apt-repo*
        path: ./apt-artifacts
        merge-multiple: true

    - name: Deploy to packages repository
      run: |
        set -euo pipefail
        echo "Current packages repo structure:"
        ls -la
        
        echo ""
        echo "=== Available APT artifacts ==="
        find ./apt-artifacts -type f 2>/dev/null | sort || echo "No artifacts found"
        
        echo ""
        echo "=== Extracting and deploying APT repository ==="
        
        # Aptly action outputs directory tree under apt-artifacts/debian; move into repo root
        if [ -d "apt-artifacts/debian/dists" ]; then
          echo "Moving dists/ to repo root..."
          rm -rf dists
          cp -a apt-artifacts/debian/dists ./
        fi

        if [ -d "apt-artifacts/debian/pool" ]; then
          echo "Moving pool/ to repo root..."
          rm -rf pool
          cp -a apt-artifacts/debian/pool ./
        fi
        
        echo ""
        echo "=== Checking for dists/pool after extraction ==="
        if [ -d "dists" ]; then
          echo "✅ dists/ directory found"
          (find dists -type f | head -10) 2>/dev/null || true
        else
          echo "❌ dists/ directory NOT found"
        fi
        
        if [ -d "pool" ]; then
          echo "✅ pool/ directory found"
          (find pool -type f | head -10) 2>/dev/null || true
        else
          echo "❌ pool/ directory NOT found"
        fi
        
        # Verify we have Release files
        if [ -z "$(find dists -name Release -o -name InRelease 2>/dev/null | head -1 2>/dev/null || true)" ]; then
          echo "⚠️  Warning: No Release or InRelease files found in dists/"
        fi
        
        echo ""
        echo "=== Configuring git ==="
        # Ensure GPG public key is available in the repository
        if [ ! -f "opencardev.gpg.key" ]; then
          echo "Exporting GPG public key..."
          echo "${{ secrets.APT_SIGNING_KEY }}" | gpg --import --batch --yes
          # Get the key ID from the imported key
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | head -1 | sed 's/.*\/\([A-F0-9]*\) .*/\1/')
          gpg --armor --export $KEY_ID > opencardev.gpg.key
          echo "✅ GPG public key exported to opencardev.gpg.key"
        else
          echo "✅ GPG public key already exists"
        fi

        echo ""
        echo "=== Final repository structure ==="
        find . -maxdepth 2 -type d | grep -E 'dists|pool' || true
        echo ""
        find . -name "Release*" -type f 2>/dev/null | head -5 || echo "No Release files"
        
        echo ""
        echo "=== Configuring git ==="
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Add changes
        git add .
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          SOURCE_REPO="${{ inputs.source_repo || github.event.client_payload.source_repo || 'opencardev/aasdk' }}"
          BUILD_RUN_ID="${{ inputs.build_run_id || github.event.client_payload.build_run_id }}"
          DISTRIBUTION="${{ inputs.distribution || github.event.client_payload.distribution || 'trixie' }}"
          
          git commit -m "Update APT repository from $SOURCE_REPO build $BUILD_RUN_ID - Distribution: $DISTRIBUTION - Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC') - Automated update via jinnatar/actions-aptly-repo@v2"
          
          echo "Pushing changes..."
          git push
          
          echo "✅ APT repository successfully updated!"
        fi

    - name: Trigger GitHub Pages deployment
      if: success()
      run: |
        echo "Triggering GitHub Pages deployment..."
        
        # Wait a moment for git push to complete
        sleep 5
        
        # Trigger Pages build using GitHub API
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/pages/builds
        
        echo "GitHub Pages deployment triggered!"

  deploy-pages:
    needs: deploy-apt-repo
    if: needs.deploy-apt-repo.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout latest main with APT files  
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Pull latest changes including APT files
      run: |
        git pull origin main
        
    - name: Verify APT repository structure
      run: |
        echo "=== Repository contents ==="
        ls -la
        echo ""
        echo "=== Checking for dists and pool directories ==="
        find . -maxdepth 2 -type d -name "dists" -o -name "pool" 2>/dev/null || echo "Not found in root"
        echo ""
        echo "=== Checking for Release files ==="
        find . -maxdepth 3 -name "Release*" 2>/dev/null | head -10 || echo "No Release files found"
        
    - name: Setup Pages
      uses: actions/configure-pages@v5
      
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  summary:
    needs: [create-apt-repo, deploy-apt-repo, deploy-pages]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: Summary
      run: |
        SOURCE_REPO="${{ inputs.source_repo || github.event.client_payload.source_repo || 'opencardev/aasdk' }}"
        BUILD_RUN_ID="${{ inputs.build_run_id || github.event.client_payload.build_run_id }}"
        DISTRIBUTION="${{ inputs.distribution || github.event.client_payload.distribution || 'trixie' }}"
        
        echo "## opencardev APT Repository Update Complete (Aptly)"
        echo "Source Repository: $SOURCE_REPO"
        echo "Build Run ID: $BUILD_RUN_ID"
        echo "Distribution: $DISTRIBUTION"
        echo "APT Repo Creation: ${{ needs.create-apt-repo.result }}"
        echo "Deployment: ${{ needs.deploy-apt-repo.result }}"
        echo "GitHub Pages (Actions): ${{ needs.deploy-pages.result }}"
        echo ""
        echo "Repository URL: https://opencardev.github.io/packages"
        echo ""
        if [[ "${{ needs.create-apt-repo.result }}" == "success" && "${{ needs.deploy-apt-repo.result }}" == "success" && "${{ needs.deploy-pages.result }}" == "success" ]]; then
          echo "✅ APT repository successfully created and deployed using Aptly!"
          echo ""
          echo "To use the repository:"
          echo '```bash'
          echo "# Add GPG key"
          echo "curl -fsSL https://opencardev.github.io/packages/opencardev.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/opencardev-archive-keyring.gpg"
          echo ""
          
          if [ "$DISTRIBUTION" = "trixie" ]; then
            echo "# Add Trixie repositories (stable + optional nightly)"
            echo 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/opencardev-archive-keyring.gpg] https://opencardev.github.io/packages trixie stable" | sudo tee /etc/apt/sources.list.d/opencardev.list'
            echo 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/opencardev-archive-keyring.gpg] https://opencardev.github.io/packages trixie nightly" | sudo tee -a /etc/apt/sources.list.d/opencardev.list'
          elif [ "$DISTRIBUTION" = "bookworm" ]; then
            echo "# Add Bookworm repositories (stable + optional nightly)"
            echo 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/opencardev-archive-keyring.gpg] https://opencardev.github.io/packages bookworm stable" | sudo tee /etc/apt/sources.list.d/opencardev.list'
            echo 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/opencardev-archive-keyring.gpg] https://opencardev.github.io/packages bookworm nightly" | sudo tee -a /etc/apt/sources.list.d/opencardev.list'
          elif [ "$DISTRIBUTION" = "all" ]; then
            echo "# Add repositories (choose your distribution)"
            echo "# For Trixie (Debian 13)"
            echo 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/opencardev-archive-keyring.gpg] https://opencardev.github.io/packages trixie stable" | sudo tee /etc/apt/sources.list.d/opencardev-trixie.list'
            echo 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/opencardev-archive-keyring.gpg] https://opencardev.github.io/packages trixie nightly" | sudo tee -a /etc/apt/sources.list.d/opencardev-trixie.list'
            echo "# For Bookworm (Debian 12)"
            echo 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/opencardev-archive-keyring.gpg] https://opencardev.github.io/packages bookworm stable" | sudo tee /etc/apt/sources.list.d/opencardev-bookworm.list'
            echo 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/opencardev-archive-keyring.gpg] https://opencardev.github.io/packages bookworm nightly" | sudo tee -a /etc/apt/sources.list.d/opencardev-bookworm.list'
          fi
          
          echo ""
          echo "# Update and install"
          echo "sudo apt update"
          echo "sudo apt install libaasdk"
          echo '```'
        else
          echo "❌ APT repository update failed. Check the logs above for details."
        fi