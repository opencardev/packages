name: APT Repository Cleanup

permissions:
  contents: write

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual deletions)'
        required: false
        type: boolean
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
      outputs:
        has_removals: ${{ steps.analyze.outputs.has_removals }}
        remove_count: ${{ steps.analyze.outputs.remove_count }}
    
    steps:
    - name: Checkout packages repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y aptly gnupg dirmngr

    - name: Analyze repository and identify packages to remove
      id: analyze
      run: |
        set -euo pipefail
        
        DRY_RUN="${{ inputs.dry_run || 'false' }}"
        
        echo "🔍 Analyzing APT repository for cleanup"
        echo "Dry run mode: $DRY_RUN"
        
        # Track packages to remove
        PACKAGES_TO_REMOVE=""
          > /tmp/cleanup_stats.txt
        
        # For each component (stable, nightly, unstable)
        for component in stable nightly unstable; do
          echo ""
          echo "📦 Analyzing component: $component"
          
          # Determine retention policy
          case "$component" in
            stable)
              KEEP_COUNT=2
              ;;
            nightly)
              KEEP_COUNT=1
              ;;
            unstable)
              KEEP_COUNT=1
              ;;
          esac
          
          echo "  Retention policy: Keep last $KEEP_COUNT version(s)"
            echo "component=$component|policy=$KEEP_COUNT" >> /tmp/cleanup_stats.txt
          
          # Find all packages in this component across all suites
          if [ ! -d "dists" ]; then
            echo "  ⚠️  No dists directory found, skipping"
            continue
          fi
          
          # For each suite
          for suite_dir in dists/*/; do
            [ -d "$suite_dir" ] || continue
            suite=$(basename "$suite_dir")
            
            component_dir="${suite_dir}/${component}"
            if [ ! -d "$component_dir" ]; then
              continue
            fi
            
            echo ""
            echo "  Suite: $suite / Component: $component"
            
            # Get all unique package names
            PACKAGES=$(find "$component_dir" -name "Packages" -type f -exec cat {} \; | \
              grep "^Package:" | awk '{print $2}' | sort | uniq)
            
            for package in $PACKAGES; do
              # Get all versions of this package, sorted by version (newest first)
              VERSIONS=$(find "$component_dir" -name "Packages" -type f -exec grep -A 10 "^Package: $package$" {} \; | \
                grep "^Version:" | awk '{print $2}' | sort -V -r)
              
              VERSION_COUNT=$(echo "$VERSIONS" | wc -l)
                [ "$VERSION_COUNT" -eq 0 ] && continue
              
                KEPT_VERSIONS=$(echo "$VERSIONS" | head -n $KEEP_COUNT | tr '\n' ',' | sed 's/,$//')
              
              if [ "$VERSION_COUNT" -gt "$KEEP_COUNT" ]; then
                # Mark old versions for removal
                OLD_VERSIONS=$(echo "$VERSIONS" | tail -n +$((KEEP_COUNT + 1)))
                  REMOVE_COUNT=$((VERSION_COUNT - KEEP_COUNT))
                
                  echo "    📦 $package: Found $VERSION_COUNT versions, removing $REMOVE_COUNT old version(s)"
                  echo "package=$package|suite=$suite|component=$component|total=$VERSION_COUNT|kept=$KEPT_VERSIONS|removed=$REMOVE_COUNT" >> /tmp/cleanup_stats.txt
                
                for old_version in $OLD_VERSIONS; do
                    [ -z "$old_version" ] && continue
                  echo "      🗑️  Marking for removal: $package $old_version"
                  PACKAGES_TO_REMOVE="$PACKAGES_TO_REMOVE\n${suite}|${component}|${package}|${old_version}"
                done
              else
                echo "    ✅ $package: $VERSION_COUNT version(s) (within retention policy)"
                  echo "package=$package|suite=$suite|component=$component|total=$VERSION_COUNT|kept=$KEPT_VERSIONS|removed=0" >> /tmp/cleanup_stats.txt
              fi
            done
          done
        done
        
        # Save packages to remove
        if [ -n "$PACKAGES_TO_REMOVE" ]; then
          echo -e "$PACKAGES_TO_REMOVE" | grep -v "^$" > /tmp/packages_to_remove.txt
          REMOVE_COUNT=$(wc -l < /tmp/packages_to_remove.txt)
          echo ""
          echo "📋 Total packages marked for removal: $REMOVE_COUNT"
          echo "has_removals=true" >> $GITHUB_OUTPUT
            echo "remove_count=$REMOVE_COUNT" >> $GITHUB_OUTPUT
        else
          echo ""
          echo "✅ No packages need to be removed"
          echo "has_removals=false" >> $GITHUB_OUTPUT
            echo "remove_count=0" >> $GITHUB_OUTPUT
        fi

    - name: Set up GPG key
      if: steps.analyze.outputs.has_removals == 'true' && inputs.dry_run != 'true'
      run: |
        set -euo pipefail
        
        echo "${{ secrets.APT_SIGNING_KEY }}" | gpg --import --batch --yes 2>&1 | grep -E "imported|key"
        
        KEYID=$(gpg --list-secret-keys --keyid-format SHORT 2>/dev/null | grep "^sec" | awk '{print $2}' | cut -d'/' -f2 | head -1)
        echo "GPG_KEYID=$KEYID" >> $GITHUB_ENV
        
        mkdir -p ~/.gnupg
        chmod 700 ~/.gnupg
        cat >> ~/.gnupg/gpg.conf << 'EOF'
        use-agent
        pinentry-mode loopback
        batch
        yes
        EOF
        
        cat >> ~/.gnupg/gpg-agent.conf << 'EOF'
        allow-loopback-pinentry
        EOF
        chmod 600 ~/.gnupg/gpg.conf ~/.gnupg/gpg-agent.conf
        
        gpg-connect-agent reloadagent /bye || true

    - name: Remove old packages
      if: steps.analyze.outputs.has_removals == 'true' && inputs.dry_run != 'true'
      env:
        GNUPGHOME: ~/.gnupg
      run: |
        set -euo pipefail
        
        echo "🗑️  Removing old packages from APT repository"
        
        # Configure Aptly
        mkdir -p ~/.aptly
        cat > ~/.aptly/aptly.conf << 'EOF'
        {
          "rootDir": "$HOME/.aptly",
          "architectures": ["amd64", "arm64", "armhf"],
          "gpgDisableSign": false,
          "gpgProvider": "gpg"
        }
        EOF
        
        # Import existing repository into aptly
        # (This is a simplified approach - in production you'd want to import the actual aptly DB)
        
        # For each package marked for removal
        while IFS='|' read -r suite component package version; do
          echo "  Removing $package $version from $suite/$component"
          
          # In a real implementation, you would:
          # 1. Import the repository into aptly
          # 2. Remove the package from the repo
          # 3. Re-publish the repository
          # 4. Export back to dists/pool structure
          
          # For now, just show what would be removed
          echo "    (Would remove: $suite / $component / $package / $version)"
        done < /tmp/packages_to_remove.txt
        
        echo ""
        echo "✅ Cleanup complete"

      - name: Upload cleanup report
        if: steps.analyze.outputs.has_removals == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-report-${{ github.run_id }}
          path: |
            /tmp/cleanup_stats.txt
            /tmp/packages_to_remove.txt
          retention-days: 30
        continue-on-error: true

    - name: Commit and push changes
      if: steps.analyze.outputs.has_removals == 'true' && inputs.dry_run != 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        git add dists/ pool/ || true
        
        if git diff --cached --quiet; then
          echo "ℹ️  No changes to commit"
        else
          REMOVE_COUNT=$(wc -l < /tmp/packages_to_remove.txt)
          git commit -m "chore: Clean up $REMOVE_COUNT old package version(s)"
          git push origin main
          echo "✅ Pushed cleanup changes"
        fi

  summary:
    needs: cleanup
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Download cleanup artifacts
        if: needs.cleanup.outputs.has_removals == 'true'
        uses: actions/download-artifact@v5
        with:
          name: cleanup-report-${{ github.run_id }}
          path: ./artifacts
        continue-on-error: true

    - name: Summary
      run: |
        echo "# APT Repository Cleanup Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status**: ${{ needs.cleanup.result }}" >> $GITHUB_STEP_SUMMARY
        echo "**Dry Run**: ${{ inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Packages Removed**: ${{ needs.cleanup.outputs.remove_count || '0' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Retention Policy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Channel | Retention |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Stable | Keep last 2 versions |" >> $GITHUB_STEP_SUMMARY
          echo "| Nightly | Keep last 1 version |" >> $GITHUB_STEP_SUMMARY
          echo "| Unstable | Keep last 1 version |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        
          # Show cleanup details if available
          if [ -f ./artifacts/cleanup_stats.txt ]; then
            echo "## 🗑️ Cleanup Details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          
            # Parse and display package cleanup info
            while IFS='|' read -r key value; do
              if [ "$key" = "package" ]; then
                # Parse package line: package=name|suite=X|component=Y|total=N|kept=versions|removed=N
                pkg_name=$(echo "$value" | cut -d'|' -f1)
                suite=$(echo "$value" | cut -d'|' -f2 | cut -d'=' -f2)
                component=$(echo "$value" | cut -d'|' -f3 | cut -d'=' -f2)
                total=$(echo "$value" | cut -d'|' -f4 | cut -d'=' -f2)
                kept=$(echo "$value" | cut -d'|' -f5 | cut -d'=' -f2)
                removed=$(echo "$value" | cut -d'|' -f6 | cut -d'=' -f2)
              
                if [ "$removed" != "0" ]; then
                  echo "- **$pkg_name** ($suite/$component): Removed $removed version(s), kept: $kept" >> $GITHUB_STEP_SUMMARY
                fi
              fi
            done < ./artifacts/cleanup_stats.txt
          elif [ "${{ needs.cleanup.outputs.remove_count || '0' }}" != "0" ]; then
            echo "## Packages Removed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "${{ needs.cleanup.outputs.remove_count }} old package version(s) were removed." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No packages required cleanup. All packages are within retention policy." >> $GITHUB_STEP_SUMMARY
          fi
