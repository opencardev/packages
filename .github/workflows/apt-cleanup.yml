---
name: APT Repository Cleanup

permissions:
  contents: write

on:
  schedule:
    - cron: "0 2 1 * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual deletions)"
        required: false
        type: boolean
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      has_removals: ${{ steps.analyze.outputs.has_removals }}
      remove_count: ${{ steps.analyze.outputs.remove_count }}

    steps:
      - name: Checkout packages repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils gzip

      - name: Analyze unreferenced pool files
        id: analyze
        shell: bash
        run: |
          set -euo pipefail

          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          echo "🔍 Analyzing pool/ references from dists/ indexes"
          echo "Dry run mode: $DRY_RUN"

          if [[ ! -d dists || ! -d pool ]]; then
            echo "⚠️  Missing dists/ or pool/ directories; nothing to clean"
            echo "has_removals=false" >> "$GITHUB_OUTPUT"
            echo "remove_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir:-}"' EXIT

          referenced_file="$tmpdir/referenced.txt"
          pool_file="$tmpdir/pool-files.txt"
          delete_file="$tmpdir/to-delete.txt"

          : > "$referenced_file"
          : > /tmp/cleanup_stats.txt

          extract_referenced_pool_paths() {
            local index_file="$1"

            case "$index_file" in
              *.xz) xz -dc -- "$index_file" ;;
              *.gz) gzip -dc -- "$index_file" ;;
              *) cat -- "$index_file" ;;
            esac | awk '
              BEGIN { in_files = 0; dir = "" }

              /^Filename:[[:space:]]+/ {
                path = $0
                sub(/^Filename:[[:space:]]+/, "", path)
                if (path ~ /^pool\//) print path
                in_files = 0
                next
              }

              /^Directory:[[:space:]]+/ {
                dir = $0
                sub(/^Directory:[[:space:]]+/, "", dir)
                in_files = 0
                next
              }

              /^Files:[[:space:]]*$/ { in_files = 1; next }

              in_files && /^[[:space:]]+/ {
                n = split($0, parts, /[[:space:]]+/)
                filename = parts[n]
                if (dir ~ /^pool\// && filename != "") print dir "/" filename
                next
              }

              /^[A-Za-z0-9-]+:[[:space:]]*/ { in_files = 0; next }
              /^$/ { in_files = 0 }
            '
          }

          while IFS= read -r index; do
            extract_referenced_pool_paths "$index" >> "$referenced_file" || true
          done < <(find dists -type f \( -name "Packages" -o -name "Packages.gz" -o -name "Packages.xz" -o -name "Sources" -o -name "Sources.gz" -o -name "Sources.xz" \) | sort)

          sort -u "$referenced_file" -o "$referenced_file"
          find pool -type f | sed 's#^\./##' | sort > "$pool_file"
          comm -23 "$pool_file" "$referenced_file" > "$delete_file"

          total_pool="$(wc -l < "$pool_file" | tr -d ' ')"
          referenced_count="$(wc -l < "$referenced_file" | tr -d ' ')"
          remove_count="$(wc -l < "$delete_file" | tr -d ' ')"
          pool_size_before="$(du -sh pool | awk '{print $1}')"

          echo "Pool files total: $total_pool"
          echo "Referenced files: $referenced_count"
          echo "Unreferenced files: $remove_count"
          echo "Pool size before: $pool_size_before"

          {
            echo "pool_total=$total_pool"
            echo "referenced=$referenced_count"
            echo "to_remove=$remove_count"
            echo "pool_size_before=$pool_size_before"
          } >> /tmp/cleanup_stats.txt

          cp "$delete_file" /tmp/unreferenced_pool_files.txt

          if [[ "$remove_count" -gt 0 ]]; then
            echo "has_removals=true" >> "$GITHUB_OUTPUT"
            echo "remove_count=$remove_count" >> "$GITHUB_OUTPUT"
          else
            echo "has_removals=false" >> "$GITHUB_OUTPUT"
            echo "remove_count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload cleanup analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cleanup-analysis-${{ github.run_id }}
          path: |
            /tmp/cleanup_stats.txt
            /tmp/unreferenced_pool_files.txt
          retention-days: 14
        continue-on-error: true

      - name: Delete unreferenced pool files
        if: steps.analyze.outputs.has_removals == 'true' && inputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "🗑️  Deleting unreferenced files from pool/"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" != pool/* ]]; then
              echo "Skipping suspicious path (outside pool): $path"
              continue
            fi
            rm -f -- "$path"
          done < /tmp/unreferenced_pool_files.txt

          find pool -type d -empty -delete

          pool_size_after="$(du -sh pool | awk '{print $1}')"
          echo "Pool size after: $pool_size_after"
          echo "pool_size_after=$pool_size_after" >> /tmp/cleanup_stats.txt

      - name: Commit and push changes
        if: steps.analyze.outputs.has_removals == 'true' && inputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pool/ || true

          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit"
          else
            remove_count="${{ steps.analyze.outputs.remove_count }}"
            git commit -m "chore: cleanup $remove_count unreferenced pool artifact(s)"
            git push origin main
            echo "✅ Pushed cleanup changes"
          fi

  summary:
    needs: cleanup
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download cleanup analysis
        uses: actions/download-artifact@v8
        with:
          name: cleanup-analysis-${{ github.run_id }}
          path: ./artifacts
        continue-on-error: true

      - name: Job Summary
        shell: bash
        run: |
          {
            echo "# APT Repository Cleanup Summary"
            echo ""
            echo "**Status**: ${{ needs.cleanup.result }}"
            echo "**Dry Run**: ${{ inputs.dry_run || 'false' }}"
            echo "**Unreferenced Files**: ${{ needs.cleanup.outputs.remove_count || '0' }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f ./artifacts/cleanup_stats.txt ]]; then
            echo "## Details" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- /' ./artifacts/cleanup_stats.txt >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f ./artifacts/unreferenced_pool_files.txt ]]; then
            count="$(wc -l < ./artifacts/unreferenced_pool_files.txt | tr -d ' ')"
            if [[ "$count" -gt 0 ]]; then
              echo "## Sample Removed Candidates" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              sed -n '1,30p' ./artifacts/unreferenced_pool_files.txt | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "✅ No unreferenced files detected." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
